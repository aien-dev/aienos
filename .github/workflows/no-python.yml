name: No Python guard

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-python:
    name: No Python guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any Python file is tracked
        run: sh .github/scripts/check-no-python.sh
