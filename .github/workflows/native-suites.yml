# Host-side suites for the native C libraries. Before this workflow, GitHub CI
# only compiled these into the kernel image; nothing ran their own tests.
#
# Coverage map (what runs where):
#   native/capability  test                   ci.yml (disabled_manually on GitHub) and, since abi-qual, the capability-abi job below
#   native/capability  mutants                this file
#   native/capability  test + ABI isolation   this file (capability-abi job: C rule tests,
#                      Rust aienos-capability{,-ffi} fmt/clippy/test, and
#                      scripts/cap_abi_isolation_test.sh)
#   native/store       test mutants           ci.yml (ci.yml is disabled_manually on GitHub, so this does NOT run in CI today)
#   native/kernel      test sanitize + gates  ck-kernel.yml (owned by another lane)
#   native/net         test sanitize mutants  this file
#   native/sig         test sanitize mutants  this file
#   native/crypto      test sanitize mutants  this file
#   native/m5          test sanitize mutants  this file
#   native/disk        test sanitize mutants  this file
#   native/disk/qemu   bare-metal NVMe and SDHCI payloads under QEMU  this file
#                      (QEMU is an emulator: PASS says nothing about a physical controller)
#   native/kv          test sanitize mutants freestanding  this file (host emulation over memory, no disk)
#   native/argus       test sanitize          this file
#
# SKIP list (declared, never green):
#   native/argus mutants: the argus Makefile has no mutants target.
#   native/argus bench:   timing benchmark, not a correctness test.
#
# Each job greps for an explicit pass marker so a suite that silently does
# nothing cannot turn the job green.

name: Native suites

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-suites.yml"
      - "scripts/qemu_native_nvme_test.sh"
      - "scripts/qemu_native_sdhci_test.sh"
      - "scripts/lib_gate_hold.sh"
      - "scripts/cap_abi_isolation_test.sh"
      - "crates/aienos-capability/**"
      - "crates/aienos-capability-ffi/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: native/${{ matrix.suite }} (${{ matrix.targets }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: net, targets: "test sanitize mutants" }
          - { suite: sig, targets: "test sanitize mutants" }
          - { suite: crypto, targets: "test sanitize mutants" }
          - { suite: m5, targets: "test sanitize mutants" }
          - { suite: disk, targets: "test sanitize mutants" }
          - { suite: argus, targets: "test sanitize" }
          - { suite: kv, targets: "test sanitize mutants freestanding" }
          - { suite: capability, targets: "mutants" }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          cc --version | head -1

      - name: Run make ${{ matrix.targets }}
        run: |
          set -o pipefail
          make -C native/${{ matrix.suite }} ${{ matrix.targets }} 2>&1 | tee suite.log

      - name: Require explicit pass markers
        run: |
          # make exits nonzero on failure; this also demands each suite's own
          # verdict lines so an empty or skipped target cannot pass.
          case "${{ matrix.suite }}" in
            net)    req='AIENOS_NET_SECURE_TESTS: PASS|NET_SANITIZE: PASS|NET_SECURE_MUTANTS: [0-9]+/[0-9]+ killed' ;;
            sig)    req='AIENOS_SIG_NATIVE: PASS|AIENOS_SIG_MUTANTS: PASS' ;;
            crypto) req='AIENOS_CRYPTO_NATIVE: PASS|AIENOS_CRYPTO_MUTANTS: PASS' ;;
            m5)     req='M5_NATIVE: PASS|M5_NATIVE_MUTANTS: PASS' ;;
            disk)   req='AIENOS_DISK_NATIVE: PASS|AIENOS_DISK_SANITIZE: PASS|AIENOS_DISK_MUTANTS: PASS' ;;
            kv)     req='AIENOS_KV_RECORD_NATIVE: PASS|AIENOS_KV_SANITIZE: PASS|AIENOS_KV_MUTANTS: PASS|AIENOS_KV_FREESTANDING: PASS' ;;
            argus)  req='GATE CONTAIN_TEST PASS|GATE CONTAIN_DETERMINISM PASS' ;;
            capability) req='AIENOS_CAP_MUTANTS: PASS' ;;
          esac
          for m in $(echo "$req" | tr '|' '\n' | sed 's/ /@/g'); do
            m="${m//@/ }"
            grep -qE "$m" suite.log || { echo "missing marker: $m"; exit 1; }
            echo "found: $m"
          done
          if grep -q 'NOT_RUN' suite.log; then echo 'NOT_RUN in log'; exit 1; fi

  capability-abi:
    # The native C authority (aienos_cap_*, 64-bit generation) is the
    # production ABI; the Rust crates are a separate 32-bit implementation
    # exported as aienos_cap32_*. This job keeps them from becoming
    # interchangeable by accident and runs both sides' rule tests.
    name: native/capability ABI isolation (C test, Rust tests, symbol/link checks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          cc --version | head -1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: C rule tests (make -C native/capability test)
        run: |
          set -o pipefail
          make -C native/capability test 2>&1 | tee cap-test.log
          grep -qE 'capability: [0-9]+ checks, 0 failures' cap-test.log
          grep -q 'contain-checks PASS' cap-test.log

      - name: Rust fmt
        run: cargo fmt -p aienos-capability -p aienos-capability-ffi -- --check

      - name: Rust clippy
        run: cargo clippy --locked -p aienos-capability -p aienos-capability-ffi --all-targets -- -D warnings

      - name: Rust tests
        run: |
          set -o pipefail
          cargo test --locked -p aienos-capability -p aienos-capability-ffi 2>&1 | tee rust-test.log
          if grep -q 'test result: FAILED' rust-test.log; then exit 1; fi
          grep -q 'reclaimed_reference_stays_dead_after_restart ... ok' rust-test.log
          grep -q 'layout_matches_the_cap32_contract ... ok' rust-test.log

      - name: ABI isolation (symbols, link probe, layout drift)
        run: |
          set -o pipefail
          bash scripts/cap_abi_isolation_test.sh 2>&1 | tee abi.log
          grep -qx 'AIENOS_CAP_ABI_ISOLATION: PASS' abi.log

  disk-qemu:
    name: native/disk qemu NVMe and SDHCI payloads
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm
          qemu-system-aarch64 --version | head -1

      - name: Run QEMU NVMe gate
        env:
          AIENOS_QUIET_FLAG: ${{ runner.temp }}/aienos-quiet-flag
          AIENOS_GATE_LOCK: ${{ runner.temp }}/aienos-gate-lock
        run: |
          bash scripts/qemu_native_nvme_test.sh 2>&1 | tee qemu.log
          # The script exits 0 on NOT_RUN; only an explicit PASS counts.
          grep -qx 'AIENOS_STORE_NVME_QEMU: PASS' qemu.log

      - name: Run QEMU SDHCI gate
        env:
          AIENOS_QUIET_FLAG: ${{ runner.temp }}/aienos-quiet-flag
          AIENOS_GATE_LOCK: ${{ runner.temp }}/aienos-gate-lock
        run: |
          bash scripts/qemu_native_sdhci_test.sh 2>&1 | tee sdhci.log
          # The script exits 0 on NOT_RUN; only an explicit PASS counts.
          grep -qx 'AIENOS_DISK_SDHCI_QEMU: PASS' sdhci.log

  argus-mutants:
    name: "native/argus mutants (SKIP: no mutants target in argus Makefile)"
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo skipped

  argus-bench:
    name: "native/argus bench (SKIP: timing benchmark, not a correctness test)"
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo skipped
