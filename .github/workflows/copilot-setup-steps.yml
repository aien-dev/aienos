name: Copilot setup steps

# Prepares the Copilot coding agent's environment with the same toolchain and
# emulator packages as scripts/verify_all.sh needs. Runs only for the agent or
# when started by hand.
on: workflow_dispatch

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none, aarch64-unknown-uefi
          components: clippy, rustfmt

      - name: Install QEMU, AAVMF firmware and swtpm
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 swtpm swtpm-tools

      - name: Warm the cargo cache
        run: cargo fetch --locked
