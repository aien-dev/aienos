name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify and QEMU Boot Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none, aarch64-unknown-uefi
          components: clippy, rustfmt

      - name: Install QEMU and AAVMF firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 swtpm swtpm-tools

      - name: Build and test native C capability authority
        run: make -C native/capability test

      - name: Build and test torn-write-safe Store record (host fault injection)
        run: make -C native/store test

      - name: Run verification harness and QEMU boot test
        run: bash scripts/verify_all.sh
