[package]
name = "aienos-boot"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AArch64 UEFI entry diagnostic for AIENOS native boot bring-up"

[features]
default = []
uefi-base = ["dep:uefi"]
# The diagnostic image uses the uefi crate's panic handler. The handoff image
# defines its own, which reports through the screen, firmware variable and
# UART after boot services exit, so the two features must not be combined.
firmware = ["uefi-base", "uefi/panic_handler"]
handoff = ["uefi-base", "dep:aienos-kernel", "dep:aienos-accel", "uefi/alloc"]
# SEED-0A candidate: polled USB keyboard after firmware exit (ADR 0012).
# Only the QEMU keyboard test enables it; hardware staging never does.
usb-keyboard = ["handoff"]
debug-xhci-without-smmu = ["usb-keyboard"]

[dependencies]
uefi = { version = "0.41", default-features = false, optional = true }
aienos-kernel = { path = "../aienos-kernel", default-features = false, optional = true }
aienos-accel = { path = "../aienos-accel", optional = true }

[[bin]]
name = "aienos-boot"
path = "src/main.rs"
required-features = ["firmware"]

[[bin]]
name = "aienos-handoff"
path = "src/handoff.rs"
required-features = ["handoff"]
