[package]
name = "aienos-boot"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AArch64 UEFI entry diagnostic for AIENOS native boot bring-up"

[features]
default = []
uefi-base = ["dep:uefi"]
# The diagnostic image uses the uefi crate's panic handler. The handoff image
# defines its own, which reports through the screen, firmware variable and
# UART after boot services exit, so the two features must not be combined.
firmware = ["uefi-base", "uefi/panic_handler"]
handoff = ["uefi-base", "dep:aienos-kernel", "dep:aienos-accel", "uefi/alloc"]
# SEED-0A candidate: polled USB keyboard after firmware exit (ADR 0012).
# Only the QEMU keyboard test enables it; hardware staging never does.
usb-keyboard = ["handoff"]
# P3 candidate: polled native NVMe read after firmware exit. Only
# scripts/qemu_nvme_test.sh enables it; hardware staging never does.
nvme-read = ["handoff"]
# P3 candidate: native NVMe write + flush qualification on top of nvme-read.
# Only scripts/qemu_nvme_rw_test.sh enables it; hardware staging never does.
nvme-write = ["nvme-read"]
# P3 candidate: Store-over-NVMe qualification (test-only). QEMU only.
# scripts/qemu_store_crash_test.sh enables it; hardware staging never does.
store-qual = ["nvme-write"]
# M4 continuity qualification (ADR 0016, test-only, QEMU only): provision /
# resume / remember / crash modes over the Store-over-NVMe path.
# scripts/qemu_continuity_test.sh enables it; hardware staging never does.
continuity-qual = ["store-qual"]
# Recovery Core qualification (ADR 0006, test-only, QEMU only): inspect /
# operator-authorised repair / operator-authorised provisioning, with a
# TEST-ONLY operator key. scripts/qemu_recovery_test.sh enables it; hardware
# staging never does.
recovery-qual = ["continuity-qual"]
# SEED-0B qualification build (ADR 0014 §6): the kernel trusts the public,
# TEST ONLY RFC 8032 qualification key in addition to the (empty) production
# set, and every report says so. Without it, every artifact candidate is
# rejected with UntrustedSigner. scripts/qemu_artifact_test.sh enables it.
seed0b-qualification = ["handoff", "aienos-kernel/seed0b-test-anchor"]
# Marks an image built for Machine 1 (native hardware) staging.
# scripts/stage_one_time_boot.sh builds with it. It adds no code; it exists so
# unsafe debug features refuse to compile into a hardware image.
hardware-staging = ["handoff"]
# UNSAFE. DEBUG ONLY. QEMU ONLY. Lets the xHCI keyboard run DMA straight to
# physical memory, with NO SMMU confinement, when the platform has no SMMU
# at all. It breaks the M3 rule "no SMMU confinement means no DMA" and exists
# only to debug the xHCI driver in a QEMU machine without iommu=smmuv3. It
# never applies when an SMMU exists but failed to initialise, it prints a
# warning on every boot, and it is a compile error together with
# `hardware-staging`. Reach it only through AIENOS_UNSAFE_DMA_BYPASS=1 in
# scripts/qemu_keyboard_test.sh.
unsafe-debug-dma-without-smmu = ["usb-keyboard"]
# UNSAFE. DEBUG ONLY. QEMU ONLY. Same bypass for the NVMe read candidate:
# it lets the NVMe function DMA to physical memory with NO SMMU confinement
# when the platform has no SMMU. It never applies when an SMMU exists but
# failed to initialise, prints a warning on every boot, and is a compile
# error together with `hardware-staging`. Reach it only through
# AIENOS_UNSAFE_DMA_BYPASS=1 in scripts/qemu_nvme_test.sh.
unsafe-debug-nvme-dma-without-smmu = ["nvme-read"]

[dependencies]
uefi = { version = "0.41", default-features = false, optional = true }
aienos-kernel = { path = "../aienos-kernel", default-features = false, optional = true }
aienos-accel = { path = "../aienos-accel", optional = true }

[[bin]]
name = "aienos-boot"
path = "src/main.rs"
required-features = ["firmware"]

[[bin]]
name = "aienos-handoff"
path = "src/handoff.rs"
required-features = ["handoff"]

[[bin]]
name = "aienos-rollback-mock"
path = "src/rollback_mock.rs"
required-features = ["handoff"]
