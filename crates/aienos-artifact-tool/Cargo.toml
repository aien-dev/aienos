[package]
name = "aienos-artifact-tool"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Host tooling for canonical AIENOS Binary Artifact v0 files"

[dependencies]
aienos-artifact = { path = "../aienos-artifact" }
aienos-crypto = { path = "../aienos-crypto" }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[features]
default = []
seed0b-test-signing = ["aienos-artifact/seed0b-test-anchor"]
