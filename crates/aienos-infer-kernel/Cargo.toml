# Standalone (not a member of the host workspace): built only for
# aarch64-unknown-none and linked into the C kernel image (CK_INFER_LIB).
[package]
name = "aienos-infer-kernel"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Links aienos-infer into the general-regs-only C kernel: bump allocator, ingest, prefill + greedy decode (aienos#34 lanes 4-5)."

[lib]
crate-type = ["staticlib"]

[dependencies]
aienos-infer = { path = "../aienos-infer" }

[workspace]

[profile.release]
panic = "abort"
opt-level = 2
lto = false
codegen-units = 1

[profile.dev]
panic = "abort"
