[package]
name = "allen-reflex"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ALLEN REFLEX: no_std hypervector decision core that maps an operator message to one agent action"

[lib]
path = "src/lib.rs"

[dependencies]
aienos-crypto = { workspace = true }

# Host-only mutants for crates/allen-reflex/tests/route.rs (red before green). Never enabled in an image:
# scripts/allen_route_mutants.sh requires each one to make the route tests FAIL.
[features]
route-mutant-grant = []
route-mutant-dialog-pending = []
route-mutant-guest-memory = []
